name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish ".\Cycle Data Project.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None --output ".\artifacts\publish\win-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: magene-cycle-data-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
